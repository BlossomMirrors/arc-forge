services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: registry.blossomos.org/blossom/arc-store/forge/main
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    # flatpak-builder's bwrap sandbox needs user/mount namespace capabilities
    # a plain container doesn't get by default - see Dockerfile. This is now
    # the SAME container serving public HTTP traffic, a real trade-off versus
    # the old design's separate signing host; see README.md.
    privileged: true
    volumes:
      - flatpak-repo:/repo
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/forge
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ORIGIN: ${BETTER_AUTH_URL}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      FORGE_SECRETS_KEY: ${FORGE_SECRETS_KEY}
      FLATPAK_MAX_BUNDLE_BYTES: ${FLATPAK_MAX_BUNDLE_BYTES:-8589934592}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-true}
      METADEFENDER_API_KEY: ${METADEFENDER_API_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      # adapter-node caps request bodies independently of any app-level check;
      # fixed to Infinity (not configurable) since 0 is NOT "unlimited", it
      # means every request body is rejected outright (adapter-node treats 0
      # as a literal 0-byte limit), which is easy to set by mistake.
      BODY_SIZE_LIMIT: Infinity
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  # The OSTree repo itself - needs a real local filesystem (flatpak-builder's
  # commit writes rely on hardlinks, which an R2/rclone FUSE mount can't
  # provide - see flatpak_publish_pipeline memory for the reproduced
  # `renameat`/`linkat` EPERM). Point this at a real block storage volume
  # (e.g. a Hetzner Volume) mounted on the host, not the VM's boot disk - this
  # repo is tens of GB and growing. Forge both writes to this (see
  # src/lib/server/flatpak-publish.ts) and serves it directly at /flatpak/*
  # (see src/routes/flatpak/[...path]/+server.ts) - no separate builder
  # container, no R2/CDN, all in this one container now.
  flatpak-repo:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/hetzner-volume/flatpak-repo # adjust to the real mount path on this host
