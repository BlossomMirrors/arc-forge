services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: registry.blossomos.org/blossom/arc-store/forge/main
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/forge
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ORIGIN: ${BETTER_AUTH_URL}
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      BUNNYCDN_PASSWORD: ${BUNNYCDN_PASSWORD}
      FORGE_SECRETS_KEY: ${FORGE_SECRETS_KEY}
      FLATPAK_MAX_BUNDLE_BYTES: ${FLATPAK_MAX_BUNDLE_BYTES:-2147483648}
      # adapter-node caps request bodies independently of any app-level check;
      # must be large enough for .flatpak bundle uploads, or 0 to disable entirely.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-0}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
